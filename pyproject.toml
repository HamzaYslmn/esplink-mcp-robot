[project]
name = "esplink-buddy"
version = "0.1.0"
description = "A robot assistant with an animated OLED face, running on an ESP32 over esplink."
readme = "README.md"
# esplink needs 3.13+.
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.3",                   # MCP server (default mode) over stdio
    "numpy>=2.5.4",
    "ollama>=0.6.3",                    # local chat backend (`chat` mode)
    "pillow>=13",                       # eye rendering, OLED-window emulator, GIF capture
    "python-dotenv>=1.2.4",            # .env loading
    "esplink[all]>=3.0.0",              # ESP32 OLED over Bluetooth (BlueZ on Linux, WinRT on Windows)
]

[project.scripts]
esplink-buddy = "modules.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modules", "src/faces"]
